# defaults.toml
# Every option hey reads, with its default. Copy what you want to change into
# your config file; anything left out keeps the value shown here. Unknown keys
# are reported as errors, so a typo cannot be silently ignored.
#
# Config file location (override with `hey --config PATH`):
# - Linux:   $XDG_CONFIG_HOME/hey/hey.toml or $HOME/.config/hey/hey.toml
# - macOS:   $HOME/Library/Application Support/hey/hey.toml
# - Windows: %APPDATA%/hey/hey.toml

# Model, as `vendor/model` from rig's catalog (https://rig.rs). The vendor's
# usual API key variable is read from the environment, e.g. OPENAI_API_KEY,
# ANTHROPIC_API_KEY or GEMINI_API_KEY. `/model` switches and saves it here.
model = "openai/gpt-5.5"

# How much the model reasons before answering: "off", "minimal", "low",
# "medium", "high", "xhigh" or "max". When unset, the model's default.
# Models that cannot honour a level report it when you send a message.
# `/think` changes and saves it here, `hey --think LEVEL` for one run.
# thinking = "medium"

# System prompt. When unset, hey uses its own agent prompt. Either way, hey
# appends what the model should know of its setting: that it is hey, which
# machine its tools act on and, with a remote, which one the user is on, when
# the conversation started, and where the config, conversations, shared files,
# memories, skills and cut tool output are.
# system_prompt = "You are a helpful assistant."

# Cap on tokens per response. When unset, the provider's default applies.
# max_tokens = 8192

# Most model calls one answer may take, tool calls included.
max_turns = 50

# Show "Hey!" when starting and "Bye!" when exiting.
greetings = true

# Per-vendor settings, keyed by the vendor in `model`. Values may use
# `~` and `$VAR`.
# [providers.ollama]
# base_url = "http://localhost:11434/v1"

[display]
# Highlight Markdown and code in responses.
syntax_highlighting = true
# Theme for responses, the prompt, input and menus; `/theme` lists and
# previews them, and saves the one picked here.
theme = "ansi"
# Wrap responses at this width, or the terminal's if narrower. 0 wraps at the
# terminal's width.
wrap_width = 100
# Colored output.
colors = true
# Ease streamed text in rather than showing each piece as it arrives.
animations = true
# How much shows of what the agent does besides answering. "full" shows all
# of it, "preview" a few lines (the latest, kept in place as they change),
# "hidden" none.
#
# The model's reasoning, under "Thought for 12s". In full it streams dimmed,
# like the reply.
thinking_output = "preview"
# What a tool call writes or prints, under it: a file's new content, an
# edit's removed and added lines, a command's output.
tool_output = "preview"
# The tool calls of subagents, under the line each starts with.
subagent_output = "preview"

[editor]
# "emacs", "vi" or "helix".
mode = "emacs"
# Paste multiple lines as one message.
bracketed_paste = true
# Keep input history across sessions, in the config directory's history.txt.
history = true
history_size = 1000
# The status at the right of the prompt: other conversations running or
# answered unseen, the remote host, the model, its thinking level and how full
# its context is. "short" (fermi · qwen3.8 medium · 24k/128k), "full"
# (fermi · ollama/qwen3.8:latest · thinking medium · 24k / 128k tokens) or
# "off".
right_prompt = "short"

[sessions]
# Where conversations are saved. Every answer is saved as it finishes;
# `/resume` and `hey --resume` continue a saved conversation.
# Default: the platform's data directory, under hey/sessions.
# dir = "~/.hey/sessions"

[shared]
# A repository of files and directories on the host that every client can
# attach to a message, as `@shared:path`; mentions without `shared:` attach
# from the user's own working directory. It need not exist.
# Default: the platform's data directory, under hey/shared.
# dir = "~/.hey/shared"

[memory]
# Remember lasting facts about you and your work across conversations. After
# each answer, one extra model call decides what to remember and what is now
# outdated; each new conversation starts with the memories closest in meaning
# to its first message. `/memories` or `hey --memories` lists them to write,
# edit and forget them.
enabled = true
# Most memories a conversation starts with. While there are no more than
# this, a conversation starts with all of them and nothing is embedded.
recall = 20
# Embedding model that places memories by meaning, as `ollama/model`; only
# Ollama's are supported (https://ollama.com/search?c=embedding). The daemon
# is the one `[providers.ollama]` names (a `/v1` suffix is fine), else
# OLLAMA_API_BASE_URL's, else http://localhost:11434. Each memory is embedded
# once and kept beside the memories file. When the model cannot be reached, a
# conversation starts with the newest memories instead.
embedding_model = "ollama/qwen3-embedding:0.6b"
# Model that decides what to remember, as `vendor/model`. When unset, the
# conversation's model.
# model = "openai/gpt-5.4-mini"
# Where memories are kept, as a Markdown list you can edit. Their embeddings
# are kept beside it, in memories.vectors.json.
# Default: the platform's data directory, under hey/memories.md.
# file = "~/.hey/memories.md"

[tools]
# Run every tool, in every conversation, without asking. Overrides `default`
# and every rule below, including "deny".
allow_all = false

# Permission for any tool without a rule below: "allow", "confirm" or "deny".
# "confirm" asks before each call and offers to allow the tool for the conversation.
default = "confirm"

# Most bytes of a result from an MCP tool, `fetch` or `web_search` the model
# reads. The model reads all of a result before it can go on, at a few seconds
# per 16 KiB on a local model, so a longer one is cut here and kept whole in a
# file the model can `read` or `search`. `web_search` asks for about this much.
# The other built-in tools bound their own output. Formerly `mcp_result_bytes`,
# which still works.
result_bytes = 16384

# Rules by tool. Built-in tools: read, list, search, write, edit, move, delete,
# shell, skill, fetch, web_search, spawn_agents. MCP tools are
# "mcp:<server>:<tool>", or "mcp:<server>" for all of a server's tools. Your
# rules extend these defaults rather than replace them.
[tools.permissions]
read = "allow"
list = "allow"
search = "allow"
skill = "allow"
spawn_agents = "allow"

[subagents]
# Let the agent start subagents (the `spawn_agents` tool): agents that each
# work on one task, several at once, and report back. They run where the
# agent does, with its tools, so with a remote they work on the host or on
# your machine as their calls say.
enabled = true
# Model subagents use, as `vendor/model`. When unset, their parent's.
# model = "openai/gpt-5.4-mini"

# With a remote, the host's agents can also call this machine's tools (its
# built-in ones, the web's and its MCP servers'), while a terminal here shows
# their conversation. Each call runs here under this machine's `[tools]`
# permissions. Before one uses a directory here, its rules are checked, keyed
# by this machine's name: its host name as `hostname -s` prints it, or
# `HEY_MACHINE` when set, so one config can serve every machine. A directory
# inside one in `allow` is used without asking; one inside `exclude` is
# refused, and file tools refuse anything in it even within an allowed
# directory. For any other you are asked: no, yes (for the conversation), or
# always, which adds it to `allow` here. Paths inside the working directory
# ask for the working directory. `tools.allow_all` does not skip this. Shell
# commands start in an allowed directory, but what they do is not confined.
# Paths may use `~` and `$VAR`.
#
# [machines.laptop]
# allow = ["~/Projects"]
# exclude = ["~/Projects/secrets", "~/.ssh"]

# MCP servers, keyed by name. A local server runs a command over stdio; a
# remote one is reached over streamable HTTP. Values may use `~` and `$VAR`,
# which keeps secrets out of this file. An optional `type` ("stdio"/"local"
# or "http"/"remote") is accepted, so entries copied from other clients work.
# Servers that only offer an OAuth sign-in are not supported yet; give them an
# API key through `headers`.
#
# Every tool a server offers is described to the model on every call, whether
# or not it is used; `tools` offers only those named, by the server's names
# for them. A name the server does not offer is reported as an error.
#
# [mcp_servers.github]
# command = "github-mcp-server"
# args = ["stdio"]
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}" }
#
# [mcp_servers.docs]
# url = "https://example.com/mcp"
# headers = { Authorization = "Bearer ${DOCS_TOKEN}" }
# tools = ["search", "fetch"]

# Remote hosts, keyed by name: machines running `hey --serve`. With a remote,
# the agent runs there, with that machine's model keys, tools, MCP servers,
# permissions and working directory, and the conversations are kept there, so
# every machine using it sees the same ones. This file still sets the display
# and editor. `remote` picks one for every run; `hey --remote NAME` for one
# run, and `hey --local` ignores it.
#
# The host's token comes from `token`, which may name environment variables,
# or `token_file`, a file holding just the token. With neither, hey asks for
# it the first time and keeps it in the system keychain, or a private file in
# the data directory where there is none.
#
# `headers`, which may name environment variables too, go with every request,
# for a proxy in front of the host that wants its own credentials, such as
# Cloudflare Access.
# remote = "fermi"
#
# [remotes.fermi]
# url = "http://fermi:7700"
# token_file = "~/Sync/hey-token"
# headers = { CF-Access-Client-Id = "${HEY_ACCESS_ID}", CF-Access-Client-Secret = "${HEY_ACCESS_SECRET}" }

# How `hey --serve` hosts the agent for remote clients. It runs tools on this
# machine for anyone holding the token. There is no TLS: reach it over a
# private network (Tailscale, WireGuard, an SSH tunnel) or put an HTTPS reverse
# proxy in front of it.
[server]
# Address to listen on; "0.0.0.0:7700" for every interface.
listen = "127.0.0.1:7700"
# The token clients must present: `token`, which may name environment
# variables, or `token_file`. A token file that does not exist is generated,
# so one in a folder synced to the clients needs no copying. With neither,
# the token is generated in the data directory's hey/server-token.
# token_file = "~/Sync/hey-token"
