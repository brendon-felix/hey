# defaults.toml
# Every option hey reads, with its default. Copy what you want to change into
# your config file; anything left out keeps the value shown here. Unknown keys
# are reported as errors, so a typo cannot be silently ignored.
#
# Config file location (override with `hey --config PATH`):
# - Linux:   $XDG_CONFIG_HOME/hey/hey.toml or $HOME/.config/hey/hey.toml
# - macOS:   $HOME/Library/Application Support/hey/hey.toml
# - Windows: %APPDATA%/hey/hey.toml

# Model, as `vendor/model` from rig's catalog (https://rig.rs). The vendor's
# usual API key variable is read from the environment, e.g. OPENAI_API_KEY,
# ANTHROPIC_API_KEY or GEMINI_API_KEY. GitHub Copilot's models (`copilot/...`)
# take no key: `hey --login copilot` signs in once, on the machine the agent
# runs on. `/model` switches and saves it here.
model = "openai/gpt-5.5"

# How much the model reasons before answering: "off", "minimal", "low",
# "medium", "high", "xhigh" or "max". When unset, the model's default.
# Models that cannot honour a level report it when you send a message.
# `/think` changes and saves it here, `hey --think LEVEL` for one run.
# thinking = "medium"

# System prompt. When unset, hey uses its own agent prompt. Either way, hey
# appends what the model should know of its setting: that it is hey, which
# machine its tools act on and, with a remote, which one the user is on, when
# the conversation started, and where the config, conversations, shared files,
# memories, skills and cut tool output are.
# system_prompt = "You are a helpful assistant."

# Cap on tokens per response. When unset, the provider's default applies.
# max_tokens = 8192

# Most model calls one answer may take, tool calls included.
max_turns = 150

# Show "Hey!" when starting and "Bye!" when exiting.
greetings = true

# Stay in the REPL after answering a message given on the command line, as
# `hey --interactive` does. Otherwise `hey MESSAGE` answers and exits, and
# the messages sent so in one terminal go on one conversation (see the
# README's "One-off messages").
interactive = false

# Per-vendor settings, keyed by the vendor in `model`. Values may use
# `~` and `$VAR`.
# [providers.ollama]
# base_url = "http://localhost:11434/v1"

[display]
# Highlight Markdown and code in responses.
syntax_highlighting = true
# Theme for responses, the prompt, input and menus; `/theme` lists and
# previews them, and saves the one picked here.
theme = "ansi"
# Wrap responses at this width, or the terminal's if narrower. 0 wraps at the
# terminal's width.
wrap_width = 100
# Colored output.
colors = true
# Ease streamed text in rather than showing each piece as it arrives.
animations = true
# How much shows of what the agent does besides answering. "full" shows all
# of it, "preview" a few lines in a box (the latest, kept in place as they
# change), "hidden" none.
#
# The model's reasoning, under "Thought for 12s". In full it streams dimmed,
# like the reply.
thinking_output = "hidden"
# What a tool call writes, prints or gives back, under it: a file's new
# content, an edit's removed and added lines, a command's output, a page
# fetched, search results.
tool_output = "hidden"
# The tool calls of subagents, under the line each starts with.
subagent_output = "preview"
# Once an answer took longer than this many seconds, or whenever a tool call
# waits for approval, ring the terminal's bell and ask it for a desktop
# notification (OSC 9, or OSC 777 in VTE terminals, foot and urxvt). The
# terminal following the conversation sends it, so it reaches your machine
# with a remote host and over SSH. 0 notifies only of approvals.
notify_after_secs = 30

[editor]
# "emacs", "vi" or "helix".
mode = "emacs"
# Paste multiple lines as one message.
bracketed_paste = true
# Keep input history across sessions, in the config directory's history.txt.
history = true
history_size = 1000
# The status at the right of the prompt: other conversations running or
# answered unseen, the remote host, the model, its thinking level and how full
# its context is, and `plan` in plan mode. "short" (fermi · qwen3.8 medium · 24k/128k), "full"
# (fermi · ollama/qwen3.8:latest · thinking medium · 24k / 128k tokens) or
# "off".
right_prompt = "short"
# What Enter does with a message typed while an answer is in progress.
# "ask" offers steer or queue each time, "steer" hands it to the model at its
# next tool result, "queue" sends it once the answer ends. Ctrl+Q always
# queues and Ctrl+S always sends at once.
send_while_answering = "ask"

[sessions]
# Where conversations are saved. Every answer is saved as it finishes;
# `/resume` and `hey --resume` continue a saved conversation.
# Default: the platform's data directory, under hey/sessions.
# dir = "~/.hey/sessions"

[shared]
# A repository of files and directories on the host that every client can
# attach to a message, as `@shared:path`; mentions without `shared:` attach
# from the user's own working directory. It need not exist.
# Default: the platform's data directory, under hey/shared.
# dir = "~/.hey/shared"

[sync]
# Files, folders and git repositories on your machine to keep copied on a
# remote host, so its agent can go on working on them while you are away.
# Pushed when hey connects to the remote and every `interval_secs` after;
# after a lost connection, whatever differs is sent once it is back. A git
# repository is copied with its `.git`, minus what .gitignore lists. Files
# over 16 MB stay behind. Copies are one way, from here to the host.
# paths = ["~/code/my-project", "~/notes.md"]
# interval_secs = 30
# Where a host keeps the copies, as <dir>/<machine>/<name>.
# Default: the platform's data directory, under hey/sync.
# dir = "~/.hey/sync"

[memory]
# Remember lasting facts about you and your work across conversations. After
# each answer, one extra model call decides what to remember and what is now
# outdated; the model recalls the memories closest in meaning to a query with
# the `recall_memory` tool, so they cost no prompt tokens until used. `/memories` or `hey --memories` lists them to write,
# edit and forget them.
enabled = true
# Most memories one recall gives. While there are no more than this, a
# recall gives all of them and nothing is embedded.
recall = 20
# Embedding model that places memories by meaning, as `ollama/model`; only
# Ollama's are supported (https://ollama.com/search?c=embedding). The daemon
# is the one `[providers.ollama]` names (a `/v1` suffix is fine), else
# OLLAMA_API_BASE_URL's, else http://localhost:11434. Each memory is embedded
# once and kept beside the memories file. When the model cannot be reached, a
# recall gives the newest memories instead.
embedding_model = "ollama/qwen3-embedding:0.6b"
# Model that decides what to remember, as `vendor/model`. When unset, the
# conversation's model.
# model = "openai/gpt-5.4-mini"
# Named kinds of subagent are Markdown files in ~/.agents/agents/ and a
# project's .agents/agents/ (see the README's "Agent types"); their own
# `model`, `tools` and `thinking` override these.
# Where memories are kept, as a Markdown list you can edit. Their embeddings
# are kept beside it, in memories.vectors.json.
# Default: the platform's data directory, under hey/memories.md.
# file = "~/.hey/memories.md"

[instructions]
# Give the model the project's instructions: ~/.agents/AGENTS.md, then the
# AGENTS.md in each directory from the repository root down to the working
# directory, or its CLAUDE.md where it has none, farthest first. They are read
# when a conversation starts and kept for the whole of it. `/init` has the
# model write or update the repository's AGENTS.md.
enabled = true
# Most bytes of them, together; the rest is cut, and the model told so.
max_bytes = 32768

[compaction]
# A long conversation is compacted: its older messages are replaced by a
# summary the model writes of them, so it fits the model's window and each
# call reads less. The newest messages stay as they are, and what was
# replaced is kept in the conversation's log. `/compact` compacts at any
# time, and the agent has a `compact` tool to compact before its next step.
#
# Compact on its own once `threshold` is passed, checked before every model
# call, so a long answer is compacted while it goes on.
auto = true
# Tokens a model call may take in and give back before the conversation is
# compacted, or 90% of the model's window if that is fewer.
threshold = 400000
# Model that writes summaries, as `vendor/model`. When unset, the
# conversation's.
# model = "openai/gpt-5.4-mini"

[checkpoints]
# Before each answer changes a file under the working directory, keep it as
# it was, so `/undo` can put back the files of the latest answer, and of the
# one before at the next `/undo`. `write`, `edit`, `move` and `delete` keep
# the files they name; `shell` finds what a command changed from a snapshot
# just before and after it (skipped in a tree of more than 20,000 files
# outside git), and reports it. Files git ignores, files over 16 MiB and
# calls run on your machine through a remote are not kept. Kept in the
# host's data directory, under hey/checkpoints, per conversation.
enabled = true

[goal]
# `/goal CONDITION` keeps the agent working until CONDITION is met: after each
# answer, a model judges from the latest reply whether it is, and if not, the
# agent goes on with the judge's reason. `/goal` alone clears it.
#
# Model that judges, as `vendor/model`. When unset, `compaction.model`, else
# the conversation's.
# model = "openai/gpt-5.4-mini"
# Most times one message is answered again for a goal not yet met.
max_rounds = 10

# Hooks: commands run at points of a conversation, keyed by event:
# SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop, PreCompact
# and SubagentStop. Each runs with `sh -c` on the machine the agent runs on,
# given the event, conversation id, working directory and what the event
# concerns (tool name, arguments and result; prompt; last reply) as JSON on
# stdin. Exit 2 blocks, with stderr as the reason; exit 0 may print
# {"decision": "block", "reason": "..."} or {"additional_context": "..."}.
# Any other exit is reported and blocks nothing. A block denies a PreToolUse
# call, fails a UserPromptSubmit message, leaves a PreCompact conversation
# uncompacted, and sends a Stop or SubagentStop agent back to work with the
# reason, at most 8 times in a row. Added context goes into the first message
# (SessionStart), the message (UserPromptSubmit) or the result (PostToolUse).
# `matcher` is a regex matching whole tool names, for the tool events;
# `timeout_secs` defaults to 60.
#
# [[hooks.PreToolUse]]
# matcher = "write|edit"
# command = "~/bin/check-paths"
# timeout_secs = 10

[tools]
# Run every tool, in every conversation, without asking. Overrides `default`
# and every rule below, including "deny".
allow_all = false

# Permission for any tool without a rule below: "allow", "confirm" or "deny".
# "confirm" asks before each call and offers to allow the tool for the conversation.
default = "confirm"

# Most bytes of a result from an MCP tool, `fetch` or `web_search` the model
# reads. The model reads all of a result before it can go on, at a few seconds
# per 16 KiB on a local model, so a longer one is cut here and kept whole in a
# file the model can `read` or `search`. `web_search` asks for about this much.
# The other built-in tools bound their own output. Formerly `mcp_result_bytes`,
# which still works.
result_bytes = 16384

# Defer every MCP server's tools, as `deferred = true` does one's, once the
# servers offer more than this many tools in all. Unset defers only the
# servers that say so.
# defer_mcp_above = 40

# Rules by tool. Built-in tools: read, list, search, write, edit, move, delete,
# shell, spawn_process, process_output, process_list, process_kill, skill,
# fetch, web_search, spawn_agents, compact, todo, ask_user, exit_plan,
# tool_search, mcp_call, mcp_resources, mcp_read_resource. In plan mode
# (`/plan`, `hey --plan`) only those that change nothing run, whatever their
# rule says. MCP tools are "mcp:<server>:<tool>", or "mcp:<server>" for all of
# a server's tools; a deferred tool called through `mcp_call` is permitted
# under its own rules, not `mcp_call`'s. Your rules extend these defaults
# rather than replace them.
[tools.permissions]
read = "allow"
list = "allow"
search = "allow"
process_output = "allow"
process_list = "allow"
skill = "allow"
spawn_agents = "allow"
compact = "allow"
todo = "allow"
ask_user = "allow"
exit_plan = "allow"
tool_search = "allow"

[subagents]
# Let the agent start subagents (the `spawn_agents` tool): agents that each
# work on one task, several at once, and report back. They run where the
# agent does, with its tools, so with a remote they work on the host or on
# your machine as their calls say.
enabled = true
# Model subagents use, as `vendor/model`. When unset, their parent's.
# model = "openai/gpt-5.4-mini"

# With a remote, the host's agents can also call this machine's tools (its
# built-in ones, the web's and its MCP servers'), while a terminal here shows
# their conversation. Each call runs here under this machine's `[tools]`
# permissions. Before one uses a directory here, its rules are checked, keyed
# by this machine's name: its host name as `hostname -s` prints it, or
# `HEY_MACHINE` when set, so one config can serve every machine. A directory
# inside one in `allow` is used without asking; one inside `exclude` is
# refused, and file tools refuse anything in it even within an allowed
# directory. For any other you are asked: no, yes (for the conversation), or
# always, which adds it to `allow` here. Paths inside the working directory
# ask for the working directory. `tools.allow_all` does not skip this. Shell
# commands start in an allowed directory, but what they do is not confined.
# Paths may use `~` and `$VAR`.
#
# [machines.laptop]
# allow = ["~/Projects"]
# exclude = ["~/Projects/secrets", "~/.ssh"]

# MCP servers, keyed by name. A local server runs a command over stdio; a
# remote one is reached over streamable HTTP. Values may use `~` and `$VAR`,
# which keeps secrets out of this file. An optional `type` ("stdio"/"local"
# or "http"/"remote") is accepted, so entries copied from other clients work.
# Servers that only offer an OAuth sign-in are not supported yet; give them an
# API key through `headers`.
#
# Every tool a server offers is described to the model on every call, whether
# or not it is used; `tools` offers only those named, by the server's names
# for them. A name the server does not offer is reported as an error.
#
# `deferred = true` describes none of a server's tools: the model is told the
# server's name, what it says it is for and its tools' names, looks up the
# ones it needs with `tool_search`, and calls them with `mcp_call`.
#
# A server's prompts are slash commands, `/mcp:<server>:<prompt>` or
# `/<server>:<prompt>`, followed by `key=value` arguments, or text taken as
# the first argument. Servers that offer resources give the model
# `mcp_resources` to list them and `mcp_read_resource` to read one.
#
# [mcp_servers.github]
# command = "github-mcp-server"
# args = ["stdio"]
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}" }
#
# [mcp_servers.docs]
# url = "https://example.com/mcp"
# headers = { Authorization = "Bearer ${DOCS_TOKEN}" }
# tools = ["search", "fetch"]
# deferred = true

# Remote hosts, keyed by name: machines running `hey --serve`. With a remote,
# the agent runs there, with that machine's model keys, tools, MCP servers,
# permissions and working directory, and the conversations are kept there, so
# every machine using it sees the same ones. This file still sets the display
# and editor. `remote` picks one for every run; `hey --remote NAME` for one
# run, and `hey --local` ignores it.
#
# The host's token comes from `token`, which may name environment variables,
# or `token_file`, a file holding just the token. With neither, hey asks for
# it the first time and keeps it in the system keychain, or a private file in
# the data directory where there is none.
#
# `headers`, which may name environment variables too, go with every request,
# for a proxy in front of the host that wants its own credentials, such as
# Cloudflare Access.
# remote = "fermi"
#
# [remotes.fermi]
# url = "http://fermi:7700"
# token_file = "~/Sync/hey-token"
# headers = { CF-Access-Client-Id = "${HEY_ACCESS_ID}", CF-Access-Client-Secret = "${HEY_ACCESS_SECRET}" }

# How `hey --serve` hosts the agent for remote clients. It runs tools on this
# machine for anyone holding the token. There is no TLS: reach it over a
# private network (Tailscale, WireGuard, an SSH tunnel) or put an HTTPS reverse
# proxy in front of it.
[server]
# Address to listen on; "0.0.0.0:7700" for every interface.
listen = "127.0.0.1:7700"
# The token clients must present: `token`, which may name environment
# variables, or `token_file`. A token file that does not exist is generated,
# so one in a folder synced to the clients needs no copying. With neither,
# the token is generated in the data directory's hey/server-token.
# token_file = "~/Sync/hey-token"

# What hey records of what it does, for working out what went wrong: runs
# starting and ending, every tool call with the machine it ran on and why it
# failed, and rig's spans for agent runs, model calls and tool calls
# (https://rig.rs/docs/concepts/observability), each as it closes, with its
# timing and token usage. One file a day, the last 7 kept. A host
# (`hey --serve`) and each client log on their own machine.
[log]
# What is recorded, as `tracing` filter directives
# (https://docs.rs/tracing-subscriber/latest/tracing_subscriber/filter/struct.EnvFilter.html).
# `HEY_LOG` overrides it for one run, e.g. `HEY_LOG=debug hey`.
filter = "warn,hey=info,rig=info"
# Record what is said too: system prompts, messages, replies, and tool calls'
# arguments and results. Makes logs much larger, and holds whatever you and
# the agent say.
content = false
# Where the logs are kept.
# Default: the platform's cache directory, under hey/logs.
# dir = "~/.hey/logs"
