[package]
name = "hey-rs"
version = "0.3.0"
authors = ["Brendon Felix"]
edition = "2024"
license = "MIT"
description = "A minimal command-line agent with streaming, syntax highlighting and MCP support"
homepage = "https://github.com/brendon-felix/hey"
repository = "https://github.com/brendon-felix/hey"
readme = "README.md"
keywords = ["agent", "llm", "mcp", "copilot", "cli"]
categories = ["command-line-utilities"]

[workspace]

[dependencies]
ansi-parser = "0.9"
anyhow = "1"
axum = "0.8"
bat = { version = "0.26", default-features = false }
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dirs = "7"
futures = "0.3"
http = "1"
nu-ansi-term = "0.50"
reedline = "0.53"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "query", "rustls", "stream"] }
rig-agent = "0.46"
rig-core = { version = "0.46", features = ["reqwest"] }
rig-memory = { version = "0.46", features = ["fs"] }
rig-rmcp = "0.46"
rig-tools = "0.46"
rmcp = { version = "3.9", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
syntect = "5.3"
textwrap = "0.16"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
toml = "1"
unicode-segmentation = "1"
yansi = "1"

[[bin]]
name = "hey"
path = "src/main.rs"
